# Nobody picks a version by hand. The Conventional Commits that landed decide
# it — feat: takes the minor, fix: the patch, a BREAKING CHANGE: footer the
# major — and a merge of only docs: and chore: releases nothing at all.
#
# This is the one workflow that writes to main, and it writes the version,
# the changelog, and the npm publish.
name: release

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # `branches: [main]` above filters on the branch the triggering `check`
    # run reports — for a `pull_request`-triggered run that's the PR's own
    # HEAD branch, not the base it targets, so a fork PR whose head branch
    # happens to be named `main` would still match. `event == 'push'` (only
    # `check`'s `on.push` trigger, never `pull_request`) plus
    # `head_repository.full_name == github.repository` (never a fork) is
    # the actual guarantee that the checked-out `head_sha` below is this
    # repo's own reviewed, already-merged code — semgrep's
    # yaml.github-actions.security.workflow-run-target-code-checkout,
    # flagged on first run, is a real gap the `branches:` filter alone
    # doesn't close.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # OIDC token for npm Trusted Publishing + provenance. Linked on
      # npmjs.com to this repo + this workflow file, after a one-time
      # manual bootstrap publish (Trusted Publishing can't be linked
      # before a scoped package exists at all — see #2).
      id-token: write
    steps:
      - name: Is the release token here?
        id: token
        run: |
          if [ -n "$RELEASE_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RELEASE_TOKEN is not set, so nothing was released. See #2."
          fi
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      # The rule matches on the checkout shape alone and can't see the job's
      # `if:` above, which is the actual mitigation: this only runs for a
      # `push`-triggered `check` run from this repo (never a fork, never a
      # pull_request run), so `head_sha` here is already-merged, reviewed
      # code on `main` — not an incoming PR's.
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.token.outputs.present == 'true'
        with:
          bun-version: 1.4.0

      # bun installs it; Node runs it — semantic-release checks the runtime
      # version at startup and refuses anything outside ^22.14 || >=24.10.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 24.10.0
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile
        if: steps.token.outputs.present == 'true'

      - run: bun run build
        if: steps.token.outputs.present == 'true'

      - run: ./node_modules/.bin/semantic-release
        if: steps.token.outputs.present == 'true'
        env:
          LEFTHOOK: "0"
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
