# Nobody picks a version by hand. The Conventional Commits that landed decide
# it — feat: takes the minor, fix: the patch, a BREAKING CHANGE: footer the
# major — and a merge of only docs: and chore: releases nothing at all.
#
# This is the one workflow that writes to main, and it writes the version,
# the changelog, and the npm publish.
name: release

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # OIDC token for npm Trusted Publishing + provenance — no NPM_TOKEN
      # secret needed, but the repo/workflow has to be linked as a trusted
      # publisher on npmjs.com first. See #2.
      id-token: write
    steps:
      - name: Is the release token here?
        id: token
        run: |
          if [ -n "$RELEASE_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RELEASE_TOKEN is not set, so nothing was released. See #2."
          fi
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.token.outputs.present == 'true'
        with:
          bun-version: 1.4.0

      # bun installs it; Node runs it — semantic-release checks the runtime
      # version at startup and refuses anything outside ^22.14 || >=24.10.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 24.10.0
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile
        if: steps.token.outputs.present == 'true'

      - run: bun run build
        if: steps.token.outputs.present == 'true'

      - run: ./node_modules/.bin/semantic-release
        if: steps.token.outputs.present == 'true'
        env:
          LEFTHOOK: "0"
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
