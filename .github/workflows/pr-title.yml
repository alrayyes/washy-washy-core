# Merges here are squashes, so the pull request title becomes the subject of
# the commit that lands on main, and semantic-release reads nothing else.
#
# A maintained action rather than a hand-rolled commitlint pipe: commitlint
# itself has no PR-title mode, it only ever reads commit objects, so linting
# a title is always working around that gap somehow. pull_request_target
# (not pull_request) is what lets this read a fork's PR title without
# needing to check out that fork's code at all — the title comes off the
# event payload, not off anything the fork controls.
name: pr-title

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
