# Merges here are squashes, so the pull request title becomes the subject of
# the commit that lands on main, and semantic-release reads nothing else.
name: pr-title

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Lint the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" | bunx --bun commitlint --verbose || {
            echo "::error::The pull request title is not a Conventional Commit."
            echo "::error::A squash merge makes it the subject on main, and"
            echo "::error::semantic-release reads it to decide the next version."
            exit 1
          }
