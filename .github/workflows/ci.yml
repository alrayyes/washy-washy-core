# Runs the same commands as the git hooks in lefthook.yml, so the two cannot
# drift: the hook catches it early, this is the gate that cannot be skipped.
#
# On a push to main it also publishes the API reference and the test and
# coverage reports. A repo has one Pages deployment and a second one replaces
# the first, so docs and reports ship from the `pages` job at the bottom.
#
# Every action is pinned to a commit SHA with the version in the comment. A tag
# like v7 is a mutable pointer someone else controls, and a workflow with write
# permission is not a thing to hand to a moving target.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run lint:md
      - run: bun run lint:yaml
      - run: bun run lint:package-json
      - run: bun run lint:schema
      - run: bun run typecheck
      # --reporter=junit feeds Codecov Test Analytics below - bun's own
      # test runner, no separate framework needed.
      - run: bun test --coverage --coverage-reporter=lcov --reporter=junit --reporter-outfile=junit.xml
      # Assembled on pull requests too, so a broken conversion fails before
      # the merge. Only the upload below is main-only. bun writes no
      # Cobertura, so lcov.info is converted; genhtml renders the HTML view.
      - name: Assemble the reports
        env:
          COMMIT: ${{ github.sha }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lcov=2.0-4ubuntu2
          pip install lcov_cobertura==2.1.1
          mkdir -p site/reports/tests site/reports/coverage
          cp junit.xml site/reports/tests/unit.xml
          cp coverage/lcov.info site/reports/coverage/lcov.info
          lcov_cobertura coverage/lcov.info --output site/reports/coverage/coverage.xml
          genhtml coverage/lcov.info --output-directory site/reports/coverage --quiet
          grep -q '<coverage ' site/reports/coverage/coverage.xml
          {
            echo '<!doctype html>'
            echo '<html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>Reports</title></head><body><main>'
            echo '<h1>@washy-washy/core reports</h1>'
            echo "<p>Commit <code>${COMMIT}</code>, built $(date -u +%Y-%m-%d) (UTC).</p>"
            echo '<ul>'
            echo '<li><a href="tests/unit.xml">Unit tests (JUnit XML)</a></li>'
            echo '<li><a href="coverage/">Coverage (HTML)</a></li>'
            echo '<li><a href="coverage/coverage.xml">Coverage (Cobertura XML)</a></li>'
            echo '<li><a href="coverage/lcov.info">Coverage (lcov)</a></li>'
            echo '</ul></main></body></html>'
          } > site/reports/index.html
      - name: Upload the reports
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: site/reports
          if-no-files-found: error
          retention-days: 1
      # Pinning a dependency stops it drifting; it says nothing about the
      # pinned version having a known CVE. Separate from Dependabot, which
      # only raises a pull request for a version that already moved.
      # Three ignored advisories, all transitive and dev-only (never
      # shipped), none with a published fix: braces and http-cache-semantics
      # (semantic-release tooling) and js-yaml 5.x (markdownlint-cli2).
      # Revisit when any of them publishes a patched release.
      - run: >-
          bun audit
          --ignore GHSA-vfj7-8cjw-p6xm
          --ignore GHSA-ch52-4w7c-c8xp
          --ignore GHSA-r3ph-w7gj-g6xm
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          # A Dependabot PR doesn't get repo secrets by default (GitHub's
          # own restriction, not a misconfiguration here) - CODECOV_TOKEN
          # is empty on that run, and this repo's branch protection makes
          # Codecov refuse a tokenless upload ("Token required because
          # branch is protected"). That's an upload hiccup on an
          # unprivileged run, not a real test regression - true here
          # would fail every Dependabot PR's CI on that basis alone
          # (confirmed live on this repo's own PR #52, same pattern as
          # hush-hush-php's PRs #13/#14).
          fail_ci_if_error: false
      # Test Analytics: per-test failure/flake detail, not just a coverage
      # delta. !cancelled(), not the step default - this still runs when
      # `bun test` above failed (junit.xml exists either way), but not if
      # the whole run was cancelled out from under it.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          fail_ci_if_error: false

  # A green `bun test` only proves the existing assertions still pass, not
  # that they'd catch a real change to the code under test. Stryker mutates
  # src/ one change at a time and re-runs the suite against each mutant;
  # `thresholds.break: 100` in stryker.config.mjs means a single surviving
  # mutant fails this job the same way a failing assertion would. Its own
  # job rather than a line in `check`, so a mutation-testing failure reads
  # as "the suite has a gap" rather than "the code is broken".
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run mutation

  # Proves the package actually builds and ships the two entry points it
  # claims to, and that the browser one never pulls Buffer/csv-parse in —
  # the whole reason it exists apart from the full one.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Confirm the browser build stays Node-free
        run: |
          if grep -lE 'Buffer|csv-parse' dist/browser.mjs; then
            echo "::error::dist/browser.mjs references Buffer or csv-parse"
            exit 1
          fi
      - run: npm pack --dry-run

  # SAST: cross-file taint tracking Biome's pattern-based linting can't do.
  # `--config=auto` against the free Semgrep Registry ruleset, no login and
  # no paid tier — `semgrep ci` needs a Semgrep App/AppSec Platform login
  # even for the same free ruleset (confirmed: `semgrep ci` refuses with
  # "run `semgrep login` before using `semgrep ci`" when unauthenticated),
  # so `semgrep scan` is the one of the two AC options that's actually
  # tokenless. `--config=auto` itself needs Semgrep's anonymous usage
  # metrics on to resolve which rules apply (`--metrics=off` errors:
  # "Cannot create auto config when metrics are off") — this reports scan
  # telemetry (languages detected, rule/finding counts), not source code.
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198 # 1.177.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config=auto --error

  # Public repo, so this is free — catches a pull request introducing a *new*
  # dependency that's already known-bad at merge time, rather than waiting
  # for Dependabot's next scheduled scan of what's already pinned.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Prose gets its own two jobs rather than a line in `check`, so that when
  # the run goes red the job name says which tier failed: a grammar error is
  # a mistake and a style alert is an opinion, answered differently.

  # Mechanics. LanguageTool's rule database — grammar, spelling, punctuation,
  # the phonetic article — and mechanics have a right answer, so this blocks.
  ltex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Built once by alrayyes/ltex-cli-plus, not fetched fresh here, so
    # ltex-cli-plus is already on PATH.
    container:
      image: ghcr.io/alrayyes/ltex-cli-plus@sha256:30853781c1b568518826e3191a90db95b5edf5dfbdc5b64e538cb35751156c42 # 18.7.0
    steps:
      - name: Install git
        # The image is built for the CLI, not for checkout; git is the only
        # thing actions/checkout needs that it doesn't already carry.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # It reports findings with exit code 3, not 1, so a step testing for
      # a specific code would pass a failing document. Let the shell judge
      # non-zero.
      - run: ltex-cli-plus --client-configuration=.ltex.json README.md CONTRIBUTING.md CLAUDE.md SECURITY.md

  # Style. House voice, weasel words, wordiness, undefined jargon. Advice
  # rather than a verdict: Vale exits non-zero only on error-severity
  # alerts, so its warnings are reported without failing anything.
  vale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run prose:sync
      - run: bun run lint:prose:advice

  # The commit-msg hook already reads every message, but a hook is skippable
  # and these messages are load-bearing: semantic-release reads the
  # Conventional Commits that landed to decide the next version.
  commits:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx --bun commitlint --from "${{ github.event.pull_request.base.sha }}" --to HEAD --verbose

  # The one Pages deployment: the typedoc site at the root (the README and
  # washy-washy-pdf link those URLs) with reports/ beside it. Needs every
  # other job so a red run publishes nothing, and runs on main whatever
  # changed so a docs-only push cannot delete the reports.
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, mutation, build, semgrep, ltex, vale]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run docs
      # typedoc 0.28 has no config option left to copy an arbitrary static
      # file into its output directory (the old `public` option is gone),
      # so llms.txt (llmstxt.org) is copied into the built site here rather
      # than via typedoc itself.
      - run: cp llms.txt docs-site/llms.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reports
          path: docs-site/reports
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
      # A local check proves the files, not the URL, and the deploy succeeds
      # either way. The retries cover the CDN catching up.
      - name: Check the live reports
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 \
            --retry-all-errors --output coverage.xml "${PAGE_URL%/}/reports/coverage/coverage.xml"
          grep -q '<coverage ' coverage.xml
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 \
            --retry-all-errors --output unit.xml "${PAGE_URL%/}/reports/tests/unit.xml"
          grep -q '<testsuite' unit.xml
