# Every dependency here is pinned to an exact version, which is the whole
# reason this file earns its place: a pinned version cannot drift, so the
# upgrade has to arrive as a pull request that runs the tests rather than as a
# resolution nobody reviewed.
version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      linters:
        dependency-type: development
        patterns:
          - "@biomejs/*"
          - "@commitlint/*"
          - prettier
          - markdownlint-cli2
          - lefthook
    ignore:
      # 10.0.0 switched the preset from a Handlebars mainTemplate string to a
      # writer@9+ render function, and 10.4.0 made the mismatch fail loud
      # instead of silently emitting an empty changelog body.
      # @semantic-release/release-notes-generator (14.1.1, latest stable) and
      # the commit-analyzer semantic-release@25 bundles both still pin
      # conventional-changelog-writer@^8.0.0 — a stable release-notes-generator
      # bumping past that is only in beta (15.0.0-beta.2) as of 2026-09-11.
      # Drop this once a stable release-notes-generator ships on writer@9+.
      # See #77.
      - dependency-name: "conventional-changelog-conventionalcommits"
        versions: [">=10.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
