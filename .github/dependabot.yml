# Every dependency here is pinned to an exact version, which is the whole
# reason this file earns its place: a pinned version cannot drift, so the
# upgrade has to arrive as a pull request that runs the tests rather than as a
# resolution nobody reviewed.
version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      linters:
        dependency-type: development
        patterns:
          - "@biomejs/*"
          - "@commitlint/*"
          - prettier
          - markdownlint-cli2
          - lefthook
    ignore:
      # 7.0 is the native rewrite and its npm package exports almost none of
      # the classic compiler API. typedoc 0.28.20 (latest) crashes on it and
      # peers on typescript 5.0.x to 6.0.x, so the docs build, and with it the
      # Pages deploy, broke when Dependabot bumped this in 1fd79ca. Drop this
      # once a typedoc release supports TypeScript 7
      # (https://github.com/TypeStrong/typedoc/issues/3098). See #76.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  # The stub Dockerfile that pins gitleaks for .github/workflows/gitleaks.yml.
  # Dependabot doesn't read a workflow's `container:`, and the workflow builds
  # this file instead. ci: because it changes the pipeline, not what ships.
  - package-ecosystem: docker
    directory: /.github/gitleaks
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    # A group, even of one, keeps a bump on Dependabot's lowercase group-title
    # template instead of the sentence-case single-update one, which fails
    # commitlint's subject-case rule (rules/release-bots.md).
    groups:
      gitleaks:
        patterns: ["*"]
        update-types: [minor, patch]
      gitleaks-major:
        patterns: ["*"]
        update-types: [major]
