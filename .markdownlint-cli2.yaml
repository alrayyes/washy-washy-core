config:
  # markdownlint's own maintained list of rules that fight Prettier's
  # layout decisions — 23 of them, including line-length (MD013), which
  # is off here for the same reason washy-washy-cli turns it off: prose
  # wraps where it reads best, a hard column limit fights that.
  extends: "markdownlint/style/prettier"
  # The pull request template opens with a section heading, not a title.
  MD041: false

globs:
  - "**/*.md"

ignores:
  - "**/node_modules/**"
  # Vendored by `vale sync`. Generated text belongs to nobody.
  - "styles/Google/**"
  - "styles/proselint/**"
  # Written by semantic-release from the commit subjects, and committed by
  # the release job without passing through any hook.
  - "CHANGELOG.md"
